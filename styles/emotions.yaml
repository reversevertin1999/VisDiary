# 情绪词表：21 种情绪 × 3 级强度。改这里就能调表情，不用动代码。
# 每种情绪：en 英文词 / desc 中文说明（进分镜 prompt）/ ref_view 参考胸像（可为 null，
# 没有对应胸像时表情完全靠 ACTING 文本）/ shots 推荐镜头 / manpu 推荐漫符
# levels 三级五官与肢体：body 全身（中景/全景/远景用），body_close 只允许上半身和手部（近景/特写用）
# 写作原则：具体到眉毛、眼睛（含高光/空洞）、嘴形、脸色；3 级必须漫画式夸张；
# 不写会改变角色外形的内容（不加披风、不变非人形、不把脸挡住）。

manpu_en:
  汗滴: "a big cartoon sweat drop on the side of the head"
  青筋: "a cross-shaped anger vein mark on the forehead"
  腮红线: "red blush lines on the cheeks"
  闪光: "sparkling shine effects around the character"
  阴影线: "vertical gloom lines over the upper face"
  泪花: "big glossy teary eyes with sparkling tears"
  集中线: "radial speed lines in the background"
  花背景: "a background full of blooming flowers"
  闪电背景: "a dramatic lightning bolt in the background"
  阴云: "a small dark rain cloud above the head"
  灵魂出窍: "a small ghost-like soul floating out of the mouth"
  怒气: "a red anger aura around the character"

