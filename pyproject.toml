[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visdiary"
version = "0.1.0"
description = "把纯文字日记自动画成以你的角色为主角的分格漫画"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "typer>=0.12",
    "python-frontmatter>=1.1",
    "pyyaml>=6",
    "python-dotenv>=1",
    "httpx>=0.27",
    "jinja2>=3.1",
    "playwright>=1.44",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
visdiary = "visdiary.cli:app"

[tool.setuptools.packages.find]
include = ["visdiary*"]
